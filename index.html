<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Health Assessment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f6fa;
            margin: 0;
            padding: 20px;
            color: #263746;
        }

        header {
            background: linear-gradient(135deg, #087f8c, #12a4a6);
            color: white;
            text-align: center;
            padding: 30px 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        header p {
            margin: 0;
            font-size: 16px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #087f8c;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5df;
            border-radius: 6px;
            font-size: 15px;
            background-color: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #087f8c;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin: 5px 5px 5px 0;
        }

        .add-btn {
            background-color: #087f8c;
            color: white;
        }

        .export-btn {
            background-color: #218838;
            color: white;
        }

        .clear-btn {
            background-color: #dc3545;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .counter {
            background-color: #e1f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #087f8c;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f5f9fb;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            padding: 7px 10px;
        }

        .message {
            margin-top: 12px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            color: #667784;
            margin-top: 25px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .card {
                padding: 16px;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Digital Health Assessment</h1>
        <p>Medical Data Collection and Management</p>
    </header>

    <div class="container">

        <section class="card">

            <h2>Patient Information</h2>

            <form id="medicalForm">

                <div class="form-group">
                    <label for="recordId">Record ID:</label>
                    <input
                        type="text"
                        id="recordId"
                        placeholder="Enter record ID"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="age">Age:</label>
                    <input
                        type="number"
                        id="age"
                        min="0"
                        max="120"
                        placeholder="Enter age"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="gender">Gender:</label>

                    <select id="gender" required>
                        <option value="">Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bloodPressure">
                        Systolic Blood Pressure (mmHg):
                    </label>

                    <input
                        type="number"
                        id="bloodPressure"
                        min="50"
                        max="300"
                        placeholder="Example: 120"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="glucose">
                        Blood Glucose Level (mg/dL):
                    </label>

                    <input
                        type="number"
                        id="glucose"
                        min="20"
                        max="1000"
                        placeholder="Enter glucose level"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="risk">Medical Risk Category:</label>

                    <select id="risk" required>
                        <option value="">Select risk category</option>
                        <option value="Low">Low</option>
                        <option value="Moderate">Moderate</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <button type="submit" class="add-btn">
                    Add Record
                </button>

            </form>

            <p id="message" class="message"></p>

        </section>

        <section class="card">

            <h2>Medical Records</h2>

            <div class="counter">
                Total Records:
                <span id="recordCount">0</span>
            </div>

            <button
                type="button"
                class="export-btn"
                onclick="exportCSV()"
            >
                Export to CSV
            </button>

            <button
                type="button"
                class="clear-btn"
                onclick="clearRecords()"
            >
                Clear All Records
            </button>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>Record ID</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Systolic BP</th>
                            <th>Glucose</th>
                            <th>Risk</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="recordsTable"></tbody>
                </table>

            </div>

        </section>

    </div>

    <footer>
        <p>Digital Health Assessment | Educational Use Only</p>
        <p>
            This application collects data and does not provide a medical diagnosis.
        </p>
    </footer>

    <script>
        const form = document.getElementById("medicalForm");
        const recordsTable = document.getElementById("recordsTable");
        const recordCount = document.getElementById("recordCount");
        const message = document.getElementById("message");

        let records = [];

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const record = {
                id: document.getElementById("recordId").value.trim(),
                age: Number(document.getElementById("age").value),
                gender: document.getElementById("gender").value,
                bloodPressure: Number(
                    document.getElementById("bloodPressure").value
                ),
                glucose: Number(
                    document.getElementById("glucose").value
                ),
                risk: document.getElementById("risk").value
            };

            if (records.some(item => item.id === record.id)) {
                message.style.color = "red";
                message.textContent =
                    "Error: This Record ID already exists.";
                return;
            }

            records.push(record);

            displayRecords();
            form.reset();

            message.style.color = "green";
            message.textContent = "Record added successfully!";
        });

        function displayRecords() {
            recordsTable.innerHTML = "";

            records.forEach(function(record, index) {
                const row = document.createElement("tr");

                const values = [
                    record.id,
                    record.age,
                    record.gender,
                    record.bloodPressure,
                    record.glucose,
                    record.risk
                ];

                values.forEach(function(value) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");
                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";

                deleteButton.addEventListener("click", function() {
                    records.splice(index, 1);
                    displayRecords();
                    message.textContent = "";
                });

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);

                recordsTable.appendChild(row);
            });

            recordCount.textContent = records.length;
        }

        function exportCSV() {
            if (records.length === 0) {
                alert("There are no records to export.");
                return;
            }

            const headers = [
                "Record ID",
                "Age",
                "Gender",
                "Systolic Blood Pressure",
                "Blood Glucose Level",
                "Medical Risk Category"
            ];

            const rows = records.map(function(record) {
                return [
                    record.id,
                    record.age,
                    record.gender,
                    record.bloodPressure,
                    record.glucose,
                    record.risk
                ];
            });

            const csvContent = [headers, ...rows]
                .map(row =>
                    row.map(value =>
                        '"' + String(value).replace(/"/g, '""') + '"'
                    ).join(",")
                )
                .join("\n");

            const blob = new Blob(
                ["\uFEFF" + csvContent],
                { type: "text/csv;charset=utf-8;" }
            );

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = url;
            link.download = "digital_health_assessment.csv";

            document.body.appendChild(link);
            link.click();
            link.remove();

            URL.revokeObjectURL(url);
        }

        function clearRecords() {
            if (records.length === 0) {
                alert("There are no records to clear.");
                return;
            }

            if (confirm("Are you sure you want to delete all records?")) {
                records = [];
                displayRecords();
                message.textContent = "";
            }
        }
    </script>

</body>

                    </html>
